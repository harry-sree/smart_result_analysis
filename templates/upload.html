{% extends "base.html" %}

{% block content %}

<h2>Upload Student Result Data</h2>

<div class="card mt-4">

    <div class="card-body">

        <form
            method="POST"
            enctype="multipart/form-data">

            <div class="mb-3">

                <label class="form-label">
                    Select CSV or Excel file
                </label>

                <input
                    type="file"
                    name="file"
                    class="form-control"
                    accept=".csv,.xlsx"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-primary">

                Upload Dataset

            </button>

        </form>

        <hr>

        <h5>Required Columns</h5>

        <p>
            student_id,
            student_name,
            gender,
            class,
            subject,
            internal_marks,
            assignment_marks,
            attendance,
            previous_score,
            final_score,
            result
        </p>

    </div>

</div>

{% endblock %}
