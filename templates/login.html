{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="text-center mb-4">
                    Smart Result Analysis
                </h2>

                <p class="text-center text-muted">
                    Login to continue
                </p>

                <form method="POST">

                    <div class="mb-3">

                        <label>
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Login

                    </button>

                </form>

                <hr>

                <small class="college-welcome">
                    <b>Welcone to Our College</b>
                    <br>
                    <b>College_Name_Here</b>
                </small>

            </div>

        </div>

    </div>

</div>

{% endblock %}
